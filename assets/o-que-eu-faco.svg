<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300"><title>O que eu faço</title><style>.selo{animation:selo 3.2s ease-in-out infinite alternate}@keyframes selo{to{opacity:.68}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="sangue" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#2a0206"/><stop offset=".55" stop-color="#9e0f18"/><stop offset="1" stop-color="#ff4d4d"/>
</linearGradient>
<linearGradient id="faixa" x1="0" x2="1"><stop offset="0" stop-color="#2a0206" stop-opacity="0"/><stop offset=".5" stop-color="#e0242c"/><stop offset="1" stop-color="#2a0206" stop-opacity="0"/></linearGradient></defs><g transform="translate(0,0)"><rect x=".5" y=".5" width="431" height="141" rx="14" fill="#110a0c" stroke="#3a1a1f"/><rect x="14" y=".5" width="404" height="2.5" rx="1.25" fill="url(#faixa)"/><g class="selo" style="animation-delay:-0.00s"><rect x="22" y="26" width="64" height="64" rx="16.0" fill="url(#sangue)"/><rect x="22" y="26" width="64" height="64" rx="16.0" fill="none" stroke="#ff8a7a" stroke-opacity=".35"/></g><g transform="translate(36.4,40.4) scale(1.467)" fill="none" stroke="#fff0ee" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round"><rect width="8" height="8" x="3" y="3" rx="2" /> <path d="M7 11v4a2 2 0 0 0 2 2h4" /> <rect width="8" height="8" x="13" y="13" rx="2" /></g><text x="108" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#f5e6e6">Automação de processos</text><text x="108" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">Mapeio rotinas manuais e crio fluxos</text><text x="108" y="99" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">que rodam sozinhos, com menos erros</text><text x="108" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">e mais tempo livre para a equipe.</text></g><g transform="translate(448,0)"><rect x=".5" y=".5" width="431" height="141" rx="14" fill="#110a0c" stroke="#3a1a1f"/><rect x="14" y=".5" width="404" height="2.5" rx="1.25" fill="url(#faixa)"/><g class="selo" style="animation-delay:-0.70s"><rect x="22" y="26" width="64" height="64" rx="16.0" fill="url(#sangue)"/><rect x="22" y="26" width="64" height="64" rx="16.0" fill="none" stroke="#ff8a7a" stroke-opacity=".35"/></g><g transform="translate(36.4,40.4) scale(1.467)" fill="none" stroke="#fff0ee" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round"><path d="M6.3 20.3a2.4 2.4 0 0 0 3.4 0L12 18l-6-6-2.3 2.3a2.4 2.4 0 0 0 0 3.4Z" /> <path d="m2 22 3-3" /> <path d="M7.5 13.5 10 11" /> <path d="M10.5 16.5 13 14" /> <path d="m18 3-4 4h6l-4 4" /></g><text x="108" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#f5e6e6">Integrações</text><text x="108" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">Conecto sistemas que não conversam</text><text x="108" y="99" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">entre si usando APIs, webhooks e</text><text x="108" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">troca de dados automatizada.</text></g><g transform="translate(0,158)"><rect x=".5" y=".5" width="431" height="141" rx="14" fill="#110a0c" stroke="#3a1a1f"/><rect x="14" y=".5" width="404" height="2.5" rx="1.25" fill="url(#faixa)"/><g class="selo" style="animation-delay:-1.40s"><rect x="22" y="26" width="64" height="64" rx="16.0" fill="url(#sangue)"/><rect x="22" y="26" width="64" height="64" rx="16.0" fill="none" stroke="#ff8a7a" stroke-opacity=".35"/></g><g transform="translate(36.4,40.4) scale(1.467)" fill="none" stroke="#fff0ee" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" /> <path d="M9 13a4.5 4.5 0 0 0 3-4" /> <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" /> <path d="M3.477 10.896a4 4 0 0 1 .585-.396" /> <path d="M6 18a4 4 0 0 1-1.967-.516" /> <path d="M12 13h4" /> <path d="M12 18h6a2 2 0 0 1 2 2v1" /> <path d="M12 8h8" /> <path d="M16 8V5a2 2 0 0 1 2-2" /> <circle cx="16" cy="13" r=".5" /> <circle cx="18" cy="3" r=".5" /> <circle cx="20" cy="21" r=".5" /> <circle cx="20" cy="8" r=".5" /></g><text x="108" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#f5e6e6">Inteligência artificial</text><text x="108" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">Agentes e fluxos com IA que leem,</text><text x="108" y="99" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">classificam e respondem, aplicados</text><text x="108" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">a problemas reais do dia a dia.</text></g><g transform="translate(448,158)"><rect x=".5" y=".5" width="431" height="141" rx="14" fill="#110a0c" stroke="#3a1a1f"/><rect x="14" y=".5" width="404" height="2.5" rx="1.25" fill="url(#faixa)"/><g class="selo" style="animation-delay:-2.10s"><rect x="22" y="26" width="64" height="64" rx="16.0" fill="url(#sangue)"/><rect x="22" y="26" width="64" height="64" rx="16.0" fill="none" stroke="#ff8a7a" stroke-opacity=".35"/></g><g transform="translate(36.4,40.4) scale(1.467)" fill="none" stroke="#fff0ee" stroke-width="1.10" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4" /> <path d="m6 8-4 4 4 4" /> <path d="m14.5 4-5 16" /></g><text x="108" y="50" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="600" fill="#f5e6e6">Desenvolvimento</text><text x="108" y="78" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">Scripts e ferramentas em Python e</text><text x="108" y="99" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">JavaScript, e interfaces web para</text><text x="108" y="120" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#a3878a">acompanhar e operar as automações.</text></g></svg>